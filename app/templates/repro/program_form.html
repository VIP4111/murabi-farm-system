{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:460px;">
  <h2>برنامج شياع توأمي جديد</h2>
  <form method="post" data-offline>
    <label>الأنثى</label>
    <select name="ewe_id" required>
      {% for f in females %}<option value="{{ f.id }}">{{ f.animal_no }}</option>{% endfor %}
    </select>
    <label>اسم البروتوكول</label><input name="protocol_name" placeholder="مثال: تزامن شياع + إسفنجة CIDR">
    <label>الطبيب المشرف</label>
    <select name="supervising_doctor_id">
      <option value="">-</option>
      {% for d in doctors %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
    </select>
    <label>الفحل (لو مسجّل بالنظام)</label>
    <select name="ram_id">
      <option value="">-</option>
      {% for m in males %}<option value="{{ m.id }}">{{ m.animal_no }}</option>{% endfor %}
    </select>
    <label>وصف الفحل (لو خارجي)</label><input name="ram_note">

    <label>تاريخ بداية البرنامج</label><input name="start_date" type="date" required>
    <label>موعد إدخال الجهاز (مخطط)</label><input name="device_insert_planned_at" type="date">
    <label>موعد إزالة الجهاز (مخطط)</label><input name="device_remove_planned_at" type="date">
    <label>بداية نافذة الشياع المتوقعة</label><input name="expected_estrus_start" type="date">
    <label>نهاية نافذة الشياع المتوقعة</label><input name="expected_estrus_end" type="date">
    <label>بداية نافذة التقريع</label><input name="mating_window_start" type="date">
    <label>نهاية نافذة التقريع</label><input name="mating_window_end" type="date">

    <label>ملاحظات</label><textarea name="notes" rows="2"></textarea>
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
