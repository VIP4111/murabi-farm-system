{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:460px;">
  <h2>{{ _('فحص سونار جديد') }}</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('تاريخ الفحص') }}</label><input name="exam_date" type="date" required>
    <label>{{ _('الأنثى') }}</label>
    <select name="ewe_id" required>
      {% for f in females %}<option value="{{ f.id }}">{{ f.animal_no }}</option>{% endfor %}
    </select>
    <label>{{ _('برنامج الشياع التوأمي المرتبط (اختياري)') }}</label>
    <select name="program_id">
      <option value="">-</option>
      {% for p in programs %}<option value="{{ p.id }}">#{{ p.id }} — {{ p.ewe.animal_no }}</option>{% endfor %}
    </select>
    <label>{{ _('عمر الحمل (بالأيام)') }}</label><input name="gestation_age_days" type="number">
    <label>{{ _('النتيجة') }}</label>
    <select name="result">
      <option value="">-</option>
      <option value="حامل">{{ _('حامل') }}</option>
      <option value="غير حامل">{{ _('غير حامل') }}</option>
      <option value="غير مؤكد">{{ _('غير مؤكد') }}</option>
    </select>
    <label>{{ _('عدد الأجنّة') }}</label><input name="embryo_count" type="number">
    <label><input name="heartbeat" type="checkbox" style="width:auto; display:inline-block;"> {{ _('نبض واضح؟') }}</label>
    <label>{{ _('الطبيب') }}</label>
    <select name="doctor_id">
      <option value="">-</option>
      {% for d in doctors %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
    </select>
    <label>{{ _('موعد إعادة الفحص') }}</label><input name="recheck_date" type="date">
    <label>{{ _('ملاحظات') }}</label><textarea name="notes" rows="2"></textarea>
    <button class="btn" type="submit">{{ _('حفظ') }}</button>
  </form>
</div>
{% endblock %}
