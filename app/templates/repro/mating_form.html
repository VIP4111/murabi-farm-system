{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:460px;">
  <h2>تقريع جديد</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>التاريخ</label><input name="date" type="date" required>
    <label>الأنثى</label>
    <select name="female_id" required>
      {% for f in females %}<option value="{{ f.id }}">{{ f.animal_no }}</option>{% endfor %}
    </select>
    <label>الفحل (لو مسجّل بالنظام)</label>
    <select name="male_id">
      <option value="">-</option>
      {% for m in males %}<option value="{{ m.id }}">{{ m.animal_no }}</option>{% endfor %}
    </select>
    <label>وصف الفحل (لو خارجي/غير مسجّل)</label><input name="male_note" placeholder="مثال: فحل مستعار من مزرعة الرشيد">
    <label>الحظيرة (اختياري)</label>
    <select name="barn_id">
      <option value="">-</option>
      {% for b in barns %}<option value="{{ b.id }}">{{ b.barn_name }}</option>{% endfor %}
    </select>
    <label>ملاحظات</label><textarea name="notes" rows="2"></textarea>
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
