{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>جهاز تكاثر جديد — برنامج #{{ program.id }} ({{ program.ewe.animal_no }})</h2>
  <form method="post" data-offline>
    <label>نوع الجهاز</label><input name="device_type" required placeholder="مثال: إسفنجة CIDR">
    <label>الاسم التجاري</label><input name="trade_name">
    <label>تاريخ الإدخال</label><input name="inserted_at" type="date" required>
    <label>أدخله</label><input name="inserted_by">
    <label>موعد الإزالة المخطّط</label><input name="planned_remove_at" type="date">
    <label>ملاحظات</label><textarea name="notes" rows="2"></textarea>
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
