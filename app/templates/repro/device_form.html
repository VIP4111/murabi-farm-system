{% extends "base.html" %}
{% from "_macros.html" import tip %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('جهاز تكاثر جديد') }} — {{ _('برنامج #%(id)s (%(no)s)', id=program.id, no=program.ewe.animal_no) }}</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('نوع الجهاز') }} {{ tip(_('الجهاز المستخدم لمزامنة الشياع (مثل إسفنجة هرمونية تُدخل مؤقتاً وتُزال بموعد مخطَّط) — سجّله هنا عشان يتذكّرك النظام بموعد الإزالة.')) }}</label><input name="device_type" required placeholder="{{ _('مثال: إسفنجة CIDR') }}">
    <label>{{ _('الاسم التجاري') }}</label><input name="trade_name">
    <label>{{ _('تاريخ الإدخال') }}</label><input name="inserted_at" type="date" required>
    <label>{{ _('أدخله') }}</label><input name="inserted_by">
    <label>{{ _('موعد الإزالة المخطّط') }}</label><input name="planned_remove_at" type="date">
    <label>{{ _('ملاحظات') }}</label><textarea name="notes" rows="2"></textarea>
    <button class="btn" type="submit">{{ _('حفظ') }}</button>
  </form>
</div>
{% endblock %}
