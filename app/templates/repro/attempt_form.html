{% extends "base.html" %}
{% from "_macros.html" import tip %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('محاولة تقريع جديدة') }} — {{ _('برنامج #%(id)s (%(no)s)', id=program.id, no=program.ewe.animal_no) }}</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('تاريخ التقريع') }}</label><input name="mating_date" type="date" required>
    <label>{{ _('الفحل (لو مسجّل بالنظام)') }}</label>
    <select name="ram_id">
      <option value="">-</option>
      {% for m in males %}<option value="{{ m.id }}">{{ m.animal_no }}</option>{% endfor %}
    </select>
    <label>{{ _('وصف الفحل (لو خارجي)') }}</label><input name="ram_note">
    <label>{{ _('حالة التأكيد') }} {{ tip(_('علّمها "مؤكّدة" بعد ما تتأكد فعلياً إن التقريع نجح (ملاحظة سلوك أو فحص) — هذا يساعد بمتابعة نجاح البرنامج، ولا يمنع تسجيل حمل لاحقاً حتى لو تركتها "قيد الانتظار".')) }}</label>
    <select name="confirmation_status">
      <option value="pending">{{ _('قيد الانتظار') }}</option>
      <option value="confirmed">{{ _('مؤكّدة') }}</option>
      <option value="failed">{{ _('فشلت') }}</option>
    </select>
    <label>{{ _('لاحظها') }}</label><input name="observed_by">
    <label>{{ _('ملاحظات') }}</label><textarea name="notes" rows="2"></textarea>
    <button class="btn" type="submit">{{ _('حفظ') }}</button>
  </form>
</div>
{% endblock %}
