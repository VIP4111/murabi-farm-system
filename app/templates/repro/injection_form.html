{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('حقنة هرمونية جديدة') }} — {{ _('برنامج #%(id)s (%(no)s)', id=program.id, no=program.ewe.animal_no) }}</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('اسم الهرمون') }}</label><input name="hormone_name" required>
    <label>{{ _('الجرعة') }}</label><input name="dose_value" type="number" step="0.01">
    <label>{{ _('وحدة الجرعة') }}</label><input name="dose_unit" placeholder="{{ _('مل / وحدة دولية') }}">
    <label>{{ _('طريق الإعطاء') }}</label><input name="route" placeholder="{{ _('عضل / تحت الجلد') }}">
    <label>{{ _('الموعد المخطّط') }}</label><input name="planned_at" type="date">
    <label>{{ _('الموعد الفعلي') }}</label><input name="actual_at" type="date">
    <label>{{ _('مين أعطاها') }}</label><input name="given_by">
    <label>{{ _('ملاحظات') }}</label><textarea name="notes" rows="2"></textarea>
    <button class="btn" type="submit">{{ _('حفظ') }}</button>
  </form>
</div>
{% endblock %}
