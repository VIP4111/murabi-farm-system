{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>حقنة هرمونية جديدة — برنامج #{{ program.id }} ({{ program.ewe.animal_no }})</h2>
  <form method="post" data-offline>
    <label>اسم الهرمون</label><input name="hormone_name" required>
    <label>الجرعة</label><input name="dose_value" type="number" step="0.01">
    <label>وحدة الجرعة</label><input name="dose_unit" placeholder="مل / وحدة دولية">
    <label>طريق الإعطاء</label><input name="route" placeholder="عضل / تحت الجلد">
    <label>الموعد المخطّط</label><input name="planned_at" type="date">
    <label>الموعد الفعلي</label><input name="actual_at" type="date">
    <label>مين أعطاها</label><input name="given_by">
    <label>ملاحظات</label><textarea name="notes" rows="2"></textarea>
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
