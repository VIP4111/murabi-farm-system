{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ title }}</h2>
  {% if warning %}<p class="notice" style="background:#fff5f2; border-color:#ffd0c7; color:#8b1e16;">⚠️ {{ warning }}</p>{% endif %}
  <form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>الاسم</label>
    <input name="name" required autofocus>
    <button class="btn" type="submit">إضافة</button>
    <a class="btn light" href="{{ url_for(back_endpoint) }}">إلغاء</a>
  </form>
</div>
{% endblock %}
