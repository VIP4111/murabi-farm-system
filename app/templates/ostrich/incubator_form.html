{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:460px;">
  <h2>حاضنة جديدة</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>الرمز</label><input name="code" required placeholder="مثال: INC-01">
    <label>الاسم (اختياري)</label><input name="name">
    <label>السعة (عدد البيض)</label><input name="capacity" type="number">
    <label>ملاحظات</label><textarea name="notes" rows="2"></textarea>
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
