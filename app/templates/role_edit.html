{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:560px;">
  <h2>{{ _('صلاحيات:') }} {{ role.display_name }}</h2>
  <form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('الاسم الظاهر بالواجهة') }}</label><input name="display_name" value="{{ role.display_name }}" required>
    <label style="margin-top:10px; display:block;">{{ _('الصلاحيات') }}</label>
    <div style="max-height:400px; overflow-y:auto; border:1px solid #eee; border-radius:8px; padding:10px;">
      {% for code, description in all_permissions %}
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#333; margin-bottom:6px;">
        <input type="checkbox" name="permissions" value="{{ code }}" style="width:auto;" {% if code in current_codes %}checked{% endif %}>
        <span>{{ description }} <code style="color:#999;">({{ code }})</code></span>
      </label>
      {% endfor %}
    </div>
    <button class="btn" type="submit" style="margin-top:12px;">{{ _('حفظ الصلاحيات') }}</button>
  </form>
</div>
{% endblock %}
