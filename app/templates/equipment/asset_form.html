{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('أصل جديد') }}</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('الاسم') }}</label><input name="name" required placeholder="{{ _('مثال: مولّد الحظيرة 2') }}">
    <label>{{ _('النوع') }}</label>
    <select name="category">
      <option value="shade">{{ _('مظلة') }}</option>
      <option value="generator">{{ _('مولّد') }}</option>
      <option value="waterer">{{ _('سقاية آلية') }}</option>
      <option value="pump">{{ _('مضخة مياه') }}</option>
      <option value="other">{{ _('أخرى') }}</option>
    </select>
    <label>{{ _('الحظيرة (اختياري)') }}</label>
    <select name="barn_id">
      <option value="">-</option>
      {% for b in barns %}<option value="{{ b.id }}">{{ b.barn_name }}</option>{% endfor %}
    </select>
    <label>{{ _('فترة الصيانة الدورية (يوم، اتركه فاضي لو ما فيه جدولة)') }}</label>
    <input name="maintenance_interval_days" type="number" min="1" placeholder="{{ _('مثال: 90') }}">
    <label>{{ _('ملاحظات') }}</label><textarea name="notes" rows="2"></textarea>
    <button class="btn" type="submit">{{ _('حفظ') }}</button>
  </form>
</div>
{% endblock %}
