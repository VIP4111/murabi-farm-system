{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ 'تعديل صنف' if item else 'صنف معدات جديد' }}</h2>
  <form method="post" data-offline>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>الاسم</label><input name="name" required value="{{ item.name if item else '' }}">
    <label>الفئة (اختياري)</label><input name="category" value="{{ item.category if item else '' }}" placeholder="مثال: أدوات يدوية، أجهزة، قطع غيار">
    <label>الوحدة</label><input name="unit" value="{{ item.unit if item else 'قطعة' }}">
    <label>الكمية المتوفرة حالياً</label><input name="available_qty" type="number" step="any" value="{{ item.available_qty if item else 0 }}">
    <label>الحد الأدنى للتنبيه</label><input name="min_stock_qty" type="number" step="any" value="{{ item.min_stock_qty if item else 0 }}">
    <label>سعر الوحدة (اختياري)</label><input name="unit_price" type="number" step="any" value="{{ item.unit_price if item and item.unit_price else '' }}">
    <label>ملاحظات (اختياري)</label><textarea name="notes" rows="2">{{ item.notes if item else '' }}</textarea>
    <button class="btn" type="submit">{{ 'حفظ' if item else 'إضافة' }}</button>
  </form>
</div>
{% endblock %}
