{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('تعديل صنف') if item else _('صنف معدات جديد') }}</h2>
  <form method="post" enctype="multipart/form-data" data-offline>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('الاسم') }}</label><input name="name" required value="{{ item.name if item else '' }}">
    <label>{{ _('صورة الصنف (اختياري) — تظهر بشاشة العامل عشان يميّزها بسهولة') }}</label>
    {% if item and item.photo_url %}<img src="{{ item.photo_url }}" alt="" style="width:100%; max-width:200px; border-radius:12px; margin-bottom:8px; display:block;">{% endif %}
    <input name="photo" type="file" accept="image/*">
    <label>{{ _('الفئة (اختياري)') }}</label><input name="category" value="{{ item.category if item else '' }}" placeholder="{{ _('مثال: أدوات يدوية، أجهزة، قطع غيار') }}">
    <label>{{ _('الوحدة') }}</label><input name="unit" value="{{ item.unit if item else 'قطعة' }}">
    <label>{{ _('الكمية المتوفرة حالياً') }}</label><input name="available_qty" type="number" step="any" value="{{ item.available_qty if item else 0 }}">
    <label>{{ _('الحد الأدنى للتنبيه') }}</label><input name="min_stock_qty" type="number" step="any" value="{{ item.min_stock_qty if item else 0 }}">
    <label>{{ _('سعر الوحدة (اختياري)') }}</label><input name="unit_price" type="number" step="any" value="{{ item.unit_price if item and item.unit_price else '' }}">
    <label>{{ _('ملاحظات (اختياري)') }}</label><textarea name="notes" rows="2">{{ item.notes if item else '' }}</textarea>
    {% if item and item.needs_maintenance %}
    <label style="display:flex; align-items:center; gap:8px; margin:12px 0;">
      <input type="checkbox" name="needs_maintenance" value="1" checked style="width:auto;">
      🔧 {{ _('تحتاج صيانة (بيّن هذا الخيار فاضي بعد ما تصلحها فعلياً)') }}
    </label>
    {% endif %}
    <button class="btn" type="submit">{{ _('حفظ') if item else _('إضافة') }}</button>
  </form>
</div>
{% endblock %}
