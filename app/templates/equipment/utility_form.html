{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('تسجيل قراءة استهلاك') }}</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('النوع') }}</label>
    <select name="utility_type" required>
      <option value="water">{{ _('ماء') }}</option>
      <option value="electricity">{{ _('كهرباء') }}</option>
    </select>
    <label>{{ _('التاريخ') }}</label><input name="date" type="date" required value="{{ today }}">
    <label>{{ _('الكمية') }}</label><input name="quantity" type="number" step="0.01" required>
    <label>{{ _('الوحدة (اختياري)') }}</label><input name="unit" placeholder="{{ _('مثال: م³ أو ك.و.س') }}">
    <label>{{ _('التكلفة (اختياري)') }}</label><input name="cost" type="number" step="0.01">
    <label>{{ _('ملاحظات') }}</label><textarea name="notes" rows="2"></textarea>
    <button class="btn" type="submit">{{ _('حفظ') }}</button>
  </form>
</div>
{% endblock %}
