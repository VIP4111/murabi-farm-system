{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('مستودع جديد') }}</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('الاسم') }}</label><input name="name" required placeholder="{{ _('مثال: صيدلية فرعية — حظيرة 3') }}">
    <label>{{ _('النوع') }}</label>
    <select name="warehouse_type" required>
      {% for t in types %}<option value="{{ t }}">{{ type_labels[t] }}</option>{% endfor %}
    </select>
    <label>{{ _('ملاحظة الموقع (اختياري)') }}</label>
    <input name="location_note" placeholder="{{ _('مثال: بجانب حظيرة 3') }}">
    <button class="btn" type="submit">{{ _('حفظ') }}</button>
  </form>
</div>
{% endblock %}
