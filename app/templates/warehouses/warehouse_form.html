{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>مستودع جديد</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>الاسم</label><input name="name" required placeholder="مثال: صيدلية فرعية — حظيرة 3">
    <label>النوع</label>
    <select name="warehouse_type" required>
      {% for t in types %}<option value="{{ t }}">{{ type_labels[t] }}</option>{% endfor %}
    </select>
    <label>ملاحظة الموقع (اختياري)</label>
    <input name="location_note" placeholder="مثال: بجانب حظيرة 3">
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
