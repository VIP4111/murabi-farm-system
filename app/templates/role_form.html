{% extends "base.html" %}
{% from "_macros.html" import tip %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('مسمّى وظيفي جديد') }}</h2>
  <form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('الاسم الظاهر بالواجهة') }}</label><input name="display_name" required placeholder="{{ _('مثال: ممرض') }}">
    <label>{{ _('الاسم الداخلي (إنجليزي، بدون مسافات)') }} {{ tip(_('معرّف تقني ثابت يستخدمه الكود داخلياً — لا يظهر لأي مستخدم عادي. لو تركته فاضياً، يُستخدم الاسم الظاهر نفسه بدلاً منه.')) }}</label><input name="name" placeholder="{{ _('مثال: nurse') }}">
    <button class="btn" type="submit">{{ _('حفظ ثم تحديد الصلاحيات') }}</button>
  </form>
</div>
{% endblock %}
