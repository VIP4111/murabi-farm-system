{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('حركة مخزون علف جديدة') }}</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('المكوّن') }}</label>
    <select name="feed_id" required>
      {% for f in feeds %}<option value="{{ f.id }}">{{ f.name }} ({{ f.available_qty }} {{ f.unit }})</option>{% endfor %}
    </select>
    <label>{{ _('النوع') }}</label>
    <select name="movement_type" required>
      <option value="in">{{ _('وارد (شراء/تعبئة)') }}</option>
      <option value="out">{{ _('صادر (توزيع فعلي)') }}</option>
    </select>
    <label>{{ _('الكمية') }}</label><input name="quantity" type="number" step="0.01" required>
    <label>{{ _('الحظيرة (إلزامي لحركة "صادر" — عشان تنحسب التكلفة اليومية للحظيرة صح)') }}</label>
    <select name="barn_id">
      <option value="">{{ _('بدون حظيرة (وارد فقط)') }}</option>
      {% for b in barns %}<option value="{{ b.id }}">{{ b.barn_name }}</option>{% endfor %}
    </select>
    <label>{{ _('الحيوان (اختياري)') }}</label>
    <select name="animal_id">
      <option value="">-</option>
      {% for a in animals %}<option value="{{ a.id }}">{{ a.animal_no }}</option>{% endfor %}
    </select>
    <label>{{ _('ملاحظة') }}</label><input name="note">
    <button class="btn" type="submit">{{ _('حفظ') }}</button>
  </form>
</div>
{% endblock %}
