{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>خطة تغذية جديدة</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>الحظيرة</label>
    <select name="barn_id" required>
      {% for b in barns %}<option value="{{ b.id }}">{{ b.barn_name }}</option>{% endfor %}
    </select>
    <label>الوصفة</label>
    <select name="ration_id" required>
      {% for r in rations %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}
    </select>
    <label>الكمية اليومية لكل رأس (كجم)</label><input name="daily_qty_per_animal_kg" type="number" step="0.01" required>
    <label>تاريخ البداية</label><input name="start_date" type="date" required>
    <label>تاريخ النهاية (اختياري)</label><input name="end_date" type="date">
    <label>ملاحظات</label><textarea name="notes" rows="2"></textarea>
    <label>سبب التجاوز (لو ظهر تحذير زيادة مفاجئة بالمركزات)</label>
    <textarea name="increase_override_reason" rows="2" placeholder="املأه فقط لو رجعت الشاشة بتحذير — اكتب السبب"></textarea>
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
