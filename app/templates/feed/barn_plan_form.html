{% extends "base.html" %}
{% from "_macros.html" import tip %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('خطة تغذية جديدة') }}</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('الحظيرة') }}</label>
    <select name="barn_id" required>
      {% for b in barns %}<option value="{{ b.id }}">{{ b.barn_name }}</option>{% endfor %}
    </select>
    <label>{{ _('الوصفة') }}</label>
    <select name="ration_id" required>
      {% for r in rations %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}
    </select>
    <label>{{ _('الكمية اليومية لكل رأس (كجم)') }} {{ tip(_('كمية العلف بالكيلو لرأس واحد باليوم — النظام يضربها بعدد رؤوس الحظيرة الفعلي عشان يحسب الاستهلاك الكلي اليومي.')) }}</label>
    <input name="daily_qty_per_animal_kg" type="number" step="0.01" required>
    <label>{{ _('تاريخ البداية') }}</label><input name="start_date" type="date" required>
    <label>{{ _('تاريخ النهاية (اختياري)') }} {{ tip(_('اتركه فاضياً لو الخطة مستمرة بدون تاريخ نهاية معروف — تقدر تنهيها لاحقاً بأي وقت.')) }}</label>
    <input name="end_date" type="date">
    <label>{{ _('ملاحظات') }}</label><textarea name="notes" rows="2"></textarea>
    <details class="drawer-group">
      <summary>{{ _('سبب تجاوز (نادر الاستخدام)') }}</summary>
      <p style="color:var(--muted); font-size:12px; margin:4px 0 8px;">{{ _('اتركه فاضياً بالحالات العادية — يلزم بس لو رجعت الشاشة بتحذير زيادة مفاجئة بالمركزات.') }}</p>
      <textarea name="increase_override_reason" rows="2" placeholder="{{ _('اكتب السبب') }}"></textarea>
    </details>
    <button class="btn" type="submit">{{ _('حفظ') }}</button>
  </form>
</div>
{% endblock %}
