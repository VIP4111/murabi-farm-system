{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:500px;">
  <h2>وصفة علف جديدة</h2>
  <form method="post" data-offline>
    <label>الاسم</label><input name="name" required placeholder="مثال: علائق نفاس">
    <label>الغرض</label>
    <select name="purpose">
      <option value="">-</option>
      <option value="نمو">نمو</option>
      <option value="نفاس">نفاس</option>
      <option value="حمل_متأخر">حمل متأخر</option>
      <option value="تسمين">تسمين</option>
      <option value="صيانة">صيانة</option>
    </select>

    <h3 style="font-size:14px; margin-top:16px;">المكوّنات (النسب من إجمالي وزن الوصفة)</h3>
    {% for i in slots %}
    <div style="display:flex; gap:8px; align-items:center;">
      <select name="feed_id_{{ i }}" style="flex:2;">
        <option value="">-</option>
        {% for f in feeds %}<option value="{{ f.id }}">{{ f.name }}</option>{% endfor %}
      </select>
      <input name="percent_{{ i }}" type="number" step="0.01" placeholder="%" style="flex:1;">
    </div>
    {% endfor %}
    <p style="font-size:12px; color:#888;">اترك أي صف فاضي لو ما تحتاجه. مجموع النسب المفروض يقارب 100%.</p>

    <label>ملاحظات</label><textarea name="notes" rows="2"></textarea>
    <label>سبب التجاوز (لو ظهر تحذير نسبة الكالسيوم:الفسفور)</label>
    <textarea name="ratio_override_reason" rows="2" placeholder="املأه فقط لو رجعت الشاشة بتحذير — اكتب السبب"></textarea>
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
