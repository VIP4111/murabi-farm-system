{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('إضافة مرض للقائمة') }}</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('اسم المرض') }}</label><input name="name" required>
    <label>{{ _('الاسم بالإنجليزي (اختياري)') }}</label>
    <input name="name_en" dir="ltr">
    <p style="color:var(--muted); font-size:12px; margin:-6px 0 10px;">{{ _('يظهر بدل الاسم العربي فقط لمستخدم لغته غير عربية — لو فاضي، يبقى الاسم العربي يظهر للجميع كما هو.') }}</p>
    <label>{{ _('ملاحظات (اختياري)') }}</label><textarea name="notes" rows="2"></textarea>
    <button class="btn" type="submit">{{ _('حفظ') }}</button>
  </form>
</div>
{% endblock %}
