{% extends "base.html" %}
{% from "_macros.html" import tip %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('إضافة اسم دواء جديد') }}</h2>
  <form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ _('الاسم') }}</label>
    <input name="name" required autofocus>
    <label>{{ _('فئة الدواء (اختياري)') }} {{ tip(_('تصنيف عام للدواء (مضاد حيوي، لقاح، فيتامين...) — يساعد لاحقاً بالفرز والتقارير، ما يغيّر طريقة الاستخدام.')) }}</label>
    <select name="medicine_class">
      <option value="">-</option>
      {% for code in medicine_classes %}
      <option value="{{ code }}" {{ 'selected' if preselected_class == code }}>{{ medicine_class_labels[code] }}</option>
      {% endfor %}
    </select>
    <button class="btn" type="submit">{{ _('إضافة') }}</button>
    <a class="btn light" href="{{ url_for('health.pharmacy_new') }}">{{ _('إلغاء') }}</a>
  </form>
</div>
{% endblock %}
