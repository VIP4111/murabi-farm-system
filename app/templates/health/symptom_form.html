{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>إضافة عرض جديد</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>اسم العرض</label>
    <input name="name" required autofocus>
    <label style="display:flex; align-items:center; gap:8px; font-weight:normal;">
      <input type="checkbox" name="is_primary" value="1" style="width:auto; margin:0;">
      عرض رئيسي (تبدأ منه شجرة التشخيص، مثل "حرارة"/"إسهال")
    </label>
    <p style="color:var(--muted); font-size:12px; margin:6px 0 10px;">لو تركته بدون تحديد، يبقى "عرض متابعة" — يظهر بس كسؤال ثانوي بعد اختيار عرض رئيسي مرتبط.</p>
    <button class="btn" type="submit">إضافة</button>
    <a class="btn light" href="{{ url_for('health.symptoms_list') }}">إلغاء</a>
  </form>
</div>
{% endblock %}
