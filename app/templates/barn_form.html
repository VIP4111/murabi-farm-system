{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ 'تعديل حظيرة' if barn else 'حظيرة جديدة' }}</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>الرقم</label><input name="barn_no" required placeholder="مثال: B-01" value="{{ barn.barn_no if barn }}">
    <label>الاسم</label><input name="barn_name" required value="{{ barn.barn_name if barn }}">
    <label>النوع</label>
    <select name="barn_type">
      <option value="عادية" {{ 'selected' if barn and barn.barn_type == 'عادية' }}>عادية</option>
      <option value="عزل" {{ 'selected' if barn and barn.barn_type == 'عزل' }}>عزل</option>
      <option value="نفاس" {{ 'selected' if barn and barn.barn_type == 'نفاس' }}>نفاس</option>
    </select>
    <label>السعة</label><input name="capacity" type="number" value="{{ barn.capacity if barn }}">
    <label>العامل المسؤول</label>
    <select name="responsible_worker_id">
      <option value="">-</option>
      {% for w in workers %}<option value="{{ w.id }}" {{ 'selected' if barn and barn.responsible_worker_id == w.id }}>{{ w.name }}</option>{% endfor %}
    </select>
    <p style="color:var(--muted); font-size:12px; margin:-6px 0 10px;">توجّه له تلقائياً المهام (بند 27) والتنبيهات ("تنبيهاتي" — بند إضافي) الخاصة بهذي الحظيرة.</p>
    <label>ملاحظات</label><textarea name="notes" rows="2">{{ barn.notes if barn }}</textarea>
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
