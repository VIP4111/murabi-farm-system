{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:460px;">
  <h2>{{ _('توزيع مهمة جديدة') }}</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% include "team/_task_assign_fields.html" %}
    <button class="btn" type="submit">{{ _('توزيع') }}</button>
  </form>
</div>
<script>
(function(){
  var roleSelect = document.querySelector('.targetRoleSelect');
  var assigneeSelect = document.querySelector('.assigneeSelect');
  if (!roleSelect || !assigneeSelect) return;
  function updateAssigneeOptions(){
    var role = roleSelect.value;
    Array.prototype.forEach.call(assigneeSelect.options, function(opt){
      if (!opt.value) { opt.hidden = false; return; }
      opt.hidden = !!(role && opt.getAttribute('data-role') !== role);
    });
  }
  roleSelect.addEventListener('change', updateAssigneeOptions);
  updateAssigneeOptions();
})();
</script>
{% endblock %}
