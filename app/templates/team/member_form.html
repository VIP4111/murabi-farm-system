{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>عضو فريق جديد</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>الاسم</label><input name="name" required>
    <label>رقم الجوال (لتسجيل الدخول)</label><input name="phone" required>
    <label>كلمة المرور</label><input name="password" type="password" required>
    <label>الدور</label>
    <select name="role_id" required>
      {% for r in roles %}<option value="{{ r.id }}">{{ r.display_name }}</option>{% endfor %}
    </select>
    <label>اللغة</label>
    <select name="language">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="am">አማርኛ</option>
      <option value="hi">हिन्दी</option>
    </select>
    <button class="btn" type="submit">حفظ</button>
  </form>
</div>
{% endblock %}
