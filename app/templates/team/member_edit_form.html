{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>تعديل بيانات العضو</h2>
  <form method="post" data-offline>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>الاسم</label><input name="name" required value="{{ member.name }}">
    <label>رقم الجوال (لتسجيل الدخول)</label><input name="phone" required value="{{ member.phone }}">
    <label>الدور</label>
    <select name="role_id" required>
      {% for r in roles %}<option value="{{ r.id }}" {{ 'selected' if member.role_id == r.id }}>{{ r.display_name }}</option>{% endfor %}
    </select>
    <label>اللغة</label>
    <select name="language">
      <option value="ar" {{ 'selected' if member.language == 'ar' }}>العربية</option>
      <option value="en" {{ 'selected' if member.language == 'en' }}>English</option>
      <option value="am" {{ 'selected' if member.language == 'am' }}>አማርኛ</option>
      <option value="hi" {{ 'selected' if member.language == 'hi' }}>हिन्दी</option>
    </select>

    <label>كلمة مرور جديدة (اختياري)</label>
    <input name="new_password" type="password" placeholder="اتركها فاضية إذا ما تبي تغييرها">
    <p style="color:var(--muted); font-size:12px; margin:-6px 0 10px;">تعبئة هذا الحقل تغيّر كلمة المرور فوراً — بدون حاجة لمعرفة القديمة.</p>

    <button class="btn" type="submit">حفظ</button>
    <a class="btn light" href="{{ url_for('team.members_list') }}">إلغاء</a>
  </form>
</div>
{% endblock %}
