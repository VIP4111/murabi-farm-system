{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px; margin:40px auto; text-align:center;">
  <div style="font-size:40px; margin-bottom:6px;">{{ icon }}</div>
  <h2 style="margin:0 0 8px;">{{ title }}</h2>
  <p style="color:var(--muted); font-size:14px; margin:0 0 18px;">{{ message }}</p>
  <a class="btn" href="{{ url_for('core.home') }}">{{ _('الرئيسية') }} ←</a>
</div>
{% endblock %}
